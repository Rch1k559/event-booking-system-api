services:
  postgres:
    image: postgres:16-alpine
    container_name: ticketcraft-postgres
    environment:
      POSTGRES_DB: events_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d events_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  webapi:
    container_name: ticketcraft-api
    build:
      context: .
      dockerfile: src/WebApi/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=events_db;Username=postgres;Password=postgres
      - JwtSettings__Secret=your-super-secret-key-that-is-at-least-32-bytes-long!
      - JwtSettings__Issuer=TicketCraft
      - JwtSettings__Audience=TicketCraftUsers
      - JwtSettings__ExpiryMinutes=60
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: